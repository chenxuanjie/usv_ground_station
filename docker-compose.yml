version: '3'

services:
  usv-ground-station:
    build: .
    image: usv-ground-station:latest
    container_name: usv_ground_station
    restart: unless-stopped
    ports:
      - "8888:8888"  # 映射 宿主机端口:容器端口
    volumes:
      # 挂载整套运行时数据目录，包含 config.ini / config_default.ini / app_data.json
      - ./data:/app/data
    # 可选：如果需要在代码中正确显示宿主机 IP，或者进行广播发现，可以使用 host 模式
    # network_mode: "host"
